name: Pipeline Schedule

on:
  schedule:
    # Daily refresh (UTC)
    - cron: "0 6 * * *"
    # Weekly deep refresh (UTC, Monday)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - manual

jobs:
  run_daily:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run daily pipeline
        run: python3 scripts/run_pipeline.py --mode daily

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-schedule-daily-artifacts
          path: artifacts/**

  run_weekly:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run weekly pipeline
        run: python3 scripts/run_pipeline.py --mode weekly

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-schedule-weekly-artifacts
          path: artifacts/**

  run_manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run selected mode
        run: python3 scripts/run_pipeline.py --mode "${{ github.event.inputs.mode }}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-schedule-manual-artifacts
          path: artifacts/**
